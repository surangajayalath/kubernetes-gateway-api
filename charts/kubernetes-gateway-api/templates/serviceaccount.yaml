{{- if .Values.global.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.global.serviceAccount.name | default (printf "%s-sa" .Values.global.metadata.name) }}
  namespace: {{ .Values.global.metadata.namespace }}
  labels:
    app.kubernetes.io/name: {{ .Values.global.metadata.name }}
    app.kubernetes.io/component: gateway-identity
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    {{- if .Values.global.serviceAccount.labels }}
    {{- toYaml .Values.global.serviceAccount.labels | nindent 4 }}
    {{- end }}
  annotations:
    # Cloud IAM Integrations (AWS IRSA / GCP Workload Identity / Azure Workload Identity)
    {{- if .Values.global.serviceAccount.awsRoleArn }}
    eks.amazonaws.com/role-arn: {{ .Values.global.serviceAccount.awsRoleArn | quote }}
    {{- end }}
    {{- if .Values.global.serviceAccount.gcpGsaEmail }}
    iam.gke.io/gcp-service-account: {{ .Values.global.serviceAccount.gcpGsaEmail | quote }}
    {{- end }}
    {{- if .Values.global.serviceAccount.azureClientId }}
    azure.workload.identity/client-id: {{ .Values.global.serviceAccount.azureClientId | quote }}
    {{- end }}
    {{- if .Values.global.serviceAccount.annotations }}
    {{- toYaml .Values.global.serviceAccount.annotations | nindent 4 }}
    {{- end }}
# Opt-out of auto-mounting tokens if explicit security hardening is enforced
automountServiceAccountToken: {{ .Values.global.serviceAccount.automountServiceAccountToken | default true }}
{{- end }}