{{- if .Values.global.routes.http.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Values.global.routes.http.name | default (printf "%s-http-route" .Values.global.metadata.name) }}
  namespace: {{ .Values.global.metadata.namespace }}
  labels:
    app.kubernetes.io/name: {{ .Values.global.metadata.name }}
    app.kubernetes.io/component: http-route
    {{- if .Values.global.routes.http.labels }}
    {{- toYaml .Values.global.routes.http.labels | nindent 4 }}
    {{- end }}
  {{- if .Values.global.routes.http.annotations }}
  annotations:
    {{- toYaml .Values.global.routes.http.annotations | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- range .Values.global.routes.http.parentRefs }}
    - name: {{ .name | default $.Values.global.metadata.name }}
      {{- if .namespace }}
      namespace: {{ .namespace }}
      {{- end }}
      {{- if .sectionName }}
      sectionName: {{ .sectionName }}
      {{- end }}
      {{- if .port }}
      port: {{ .port }}
      {{- end }}
    {{- end }}

  {{- if .Values.global.routes.http.hostnames }}
  hostnames:
    {{- toYaml .Values.global.routes.http.hostnames | nindent 4 }}
  {{- end }}

  rules:
    {{- range .Values.global.routes.http.rules }}
    - {{- if .matches }}
      matches:
        {{- toYaml .matches | nindent 8 }}
      {{- end }}

      {{- if .filters }}
      filters:
        {{- toYaml .filters | nindent 8 }}
      {{- end }}

      {{- if .backendRefs }}
      backendRefs:
        {{- range .backendRefs }}
        - name: {{ .name }}
          port: {{ .port }}
          {{- if .weight }}
          weight: {{ .weight }}
          {{- end }}
          {{- if .group }}
          group: {{ .group | quote }}
          {{- end }}
          {{- if .kind }}
          kind: {{ .kind }}
          {{- end }}
          {{- if .namespace }}
          namespace: {{ .namespace }}
          {{- end }}
        {{- end }}
      {{- end }}

      {{- if .timeouts }}
      timeouts:
        {{- toYaml .timeouts | nindent 8 }}
      {{- end }}

      {{- if .retry }}
      retry:
        {{- toYaml .retry | nindent 8 }}
      {{- end }}
    {{- end }}
{{- end }}