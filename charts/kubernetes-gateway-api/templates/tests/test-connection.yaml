apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "gateway-chart.fullname" . }}-test-connection"  # Changed 'chart.fullname' to 'gateway-chart.fullname'
  namespace: {{ .Values.global.metadata.namespace }}
  labels:
    app.kubernetes.io/name: {{ .Values.global.metadata.name }}
    app.kubernetes.io/component: test
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  containers:
    - name: wget
      image: "{{ .Values.tests.image.repository }}:{{ .Values.tests.image.tag }}"
      imagePullPolicy: {{ .Values.tests.image.pullPolicy }}
      command:
        - sh
        - -c
        - |
          set -e
          echo "Testing Gateway Listener reachability..."
          {{- range .Values.tests.targets }}
          echo "Checking {{ .name }} at {{ .url }}..."
          wget --no-check-certificate --timeout={{ $.Values.tests.timeout | default 5 }} -qO- {{ .url }} > /dev/null
          echo "SUCCESS: {{ .name }} is reachable!"
          {{- end }}
  restartPolicy: Never